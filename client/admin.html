<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Covera | لوحة الأدمن</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="admin">
  <div id="header-placeholder"></div>

  <main class="container">
    <section class="section">
      <div class="section-title">
        
        <h1>طلبات العملاء</h1>
        <p>هذه الصفحة تظهر فقط للمستخدم الذي يملك صلاحية الأدمن.</p>
      </div>

      <div id="adminGuardMessage" class="notice hidden"></div>
      <div id="adminRequestsWrap" class="grid grid-2"></div>

      <div class="section-title admin-subtitle">
        <h2>نتائج تحليل AI</h2>
        <p>آخر تحليلات المخاطر التي أنشأها المستخدمون داخل النظام.</p>
      </div>
      <div id="adminRiskWrap" class="grid grid-2"></div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="toast" class="toast"></div>
  <script src="main.js"></script>
</body>
</html>
